services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chatstack
      POSTGRES_PASSWORD: chatstack
      POSTGRES_DB: chatstack
    ports:
      - '5436:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chatstack']
      interval: 5s
      timeout: 5s
      retries: 5
