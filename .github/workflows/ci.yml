name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chatstack
          POSTGRES_PASSWORD: chatstack
          POSTGRES_DB: chatstack
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chatstack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Run tests against real Postgres/pgvector
        env:
          DATABASE_URL: postgres://chatstack:chatstack@localhost:5432/chatstack
        run: npm test
